<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The official DOMIX website is launching soon.">
    <meta name="theme-color" content="#020817">
    <link rel="canonical" href="https://domix-dj.com/">
    <title>DOMIX — Launching Soon</title>
    <link rel="preload" href="images/domix/brand/domix_logo.svg" as="image" type="image/svg+xml">
    <link rel="stylesheet" href="css/coming-soon.css">
    <script src="js/countdown.js" defer></script>
</head>

<body>
    <div class="coming-soon-shell">
        <header class="site-header">
            <span class="brand" aria-label="DOMIX">
                <img src="images/domix/brand/domix_logo.svg" alt="DOMIX" width="2000" height="600">
            </span>

            <nav class="header-socials" aria-label="DOMIX social media">
                <a href="https://www.instagram.com/domix.dj" target="_blank" rel="noopener noreferrer">Instagram</a>
                <a href="https://www.tiktok.com/@domix.dj" target="_blank" rel="noopener noreferrer">TikTok</a>
                <a href="https://soundcloud.com/domix_dj" target="_blank" rel="noopener noreferrer">SoundCloud</a>
            </nav>
        </header>

        <main class="hero">
            <div class="hero-content">
                <p class="eyebrow">Official website</p>
                <h1>Launching <span>Soon</span></h1>
                <p class="subline">The new DOMIX website goes live in:</p>

                <div class="countdown" id="countdown" role="timer" aria-label="Time remaining until the DOMIX website launches">
                    <div class="countdown-unit" id="days-unit" aria-label="0 days">
                        <span class="countdown-value" id="days" aria-hidden="true">00</span>
                        <span class="countdown-label" aria-hidden="true">Days</span>
                    </div>
                    <div class="countdown-unit" id="hours-unit" aria-label="0 hours">
                        <span class="countdown-value" id="hours" aria-hidden="true">00</span>
                        <span class="countdown-label" aria-hidden="true">Hours</span>
                    </div>
                    <div class="countdown-unit" id="minutes-unit" aria-label="0 minutes">
                        <span class="countdown-value" id="minutes" aria-hidden="true">00</span>
                        <span class="countdown-label" aria-hidden="true">Minutes</span>
                    </div>
                    <div class="countdown-unit" id="seconds-unit" aria-label="0 seconds">
                        <span class="countdown-value" id="seconds" aria-hidden="true">00</span>
                        <span class="countdown-label" aria-hidden="true">Seconds</span>
                    </div>
                </div>

                <div class="launch-message" id="launch-message" aria-live="polite" hidden>
                    <p>The website is live</p>
                    <a class="enter-button" id="enter-website">Enter website</a>
                </div>

                <div class="follow-block">
                    <p>Follow DOMIX</p>
                    <nav class="mobile-socials" aria-label="Follow DOMIX">
                        <a href="https://www.instagram.com/domix.dj" target="_blank" rel="noopener noreferrer" aria-label="Follow DOMIX on Instagram">Instagram</a>
                        <a href="https://www.tiktok.com/@domix.dj" target="_blank" rel="noopener noreferrer" aria-label="Follow DOMIX on TikTok">TikTok</a>
                        <a href="https://soundcloud.com/domix_dj" target="_blank" rel="noopener noreferrer" aria-label="Follow DOMIX on SoundCloud">SoundCloud</a>
                    </nav>
                </div>
            </div>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 DOMIX</p>
        </footer>
    </div>
</body>
</html>
